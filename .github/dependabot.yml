version: 2
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    # Major updates (e.g. Angular majors) are migrations done manually
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # A single PR for all minor and patch updates, so that packages pinning
      # each other as exact peer dependencies (e.g. Angular) move together.
      # When a single-package security PR fails (see #224), use
      # "Check for updates" in Insights > Dependency graph > Dependabot
      # to trigger this update without waiting.
      front-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
