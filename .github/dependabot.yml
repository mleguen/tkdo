version: 2
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    # Major updates (e.g. Angular majors) are migrations done manually
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # A single PR for all minor and patch updates, so that packages pinning
      # each other as exact peer dependencies (e.g. Angular) move together.
      # When a single-package security PR fails (see #224), use
      # "Check for updates" in Insights > Dependency graph > Dependabot
      # to trigger this update without waiting.
      front-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: monthly
    # Major updates are migrations done manually
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # A single PR for all minor and patch updates (same rationale as /front)
      api-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Local stack images (Dependabot raises no security updates for Docker)
  - package-ecosystem: docker
    directories:
      - /docker/*
      - /front/docker/*
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Runtime versions are aligned with production (PHP 8.4, MySQL), so
      # moving them is a migration done manually, even for a "minor" bump
      - dependency-name: php
        update-types:
          - version-update:semver-minor
      - dependency-name: mysql
        update-types:
          - version-update:semver-minor
    groups:
      dockerfiles:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Runtime versions are aligned with production (PHP 8.4, MySQL), so
      # moving them is a migration done manually, even for a "minor" bump
      - dependency-name: php
        update-types:
          - version-update:semver-minor
      - dependency-name: mysql
        update-types:
          - version-update:semver-minor
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Majors are not ignored here: actions are referenced by major tag
      # (e.g. @v4), so majors are the only updates Dependabot would raise
      github-actions:
        patterns:
          - "*"

  # Semgrep, installed by the security-scan workflow
  - package-ecosystem: pip
    directory: /.github/semgrep
    schedule:
      interval: monthly
    groups:
      semgrep:
        patterns:
          - "*"
